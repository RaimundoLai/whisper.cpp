name: Build whisper.cpp addons

on:
  workflow_dispatch:
  push:
    branches: [ test-cuda ]

jobs:
  # =================================================================================================
  # Windows Builds
  # =================================================================================================
  windows-cuda:
    runs-on: windows-2022
    strategy:
      matrix:
        cuda_version: ['12.4.0', '13.0.2']
        include:
          - cuda_version: '12.4.0'
            optimized: 'windows-cuda-1240'
          - cuda_version: '13.0.2'
            optimized: 'windows-cuda-1302'
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v4
        with:
          repository: RaimundoLai/whisper.cpp
          ref: dev
          submodules: recursive
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: |
          choco install cmake -y
          npm install -g cmake-js

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.29
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda_version }}
          method: 'network'

      - name: Build
        shell: powershell
        run: |
          cd examples/addon.node
          npm install
          cd ../../
          $env:CUDA_PATH = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          $env:CUDA_TOOLKIT_ROOT_DIR = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          
          $buildParams = @(
            "--CDBUILD_SHARED_LIBS=OFF",
            "--CDWHISPER_STATIC=ON",
            "--CDGGML_CUDA=ON",
            "--CDGGML_CUDA_GRAPHS=OFF",
            "--CDGGML_CUDA_FORCE_CUBLAS=ON",
            "--runtime=electron",
            "--runtime-version=35.1.5",
            "--arch=x64"
          )
          
          $outputName = "addon-${{ matrix.optimized }}.node"
          
          npx cmake-js compile -T addon.node -B Release $buildParams
          
          mkdir -p artifacts
          Copy-Item "build/bin/Release/addon.node.node" -Destination "artifacts/$outputName"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.optimized }}.node
          path: artifacts/addon-${{ matrix.optimized }}.node

  # =================================================================================================
  # Release Job
  # =================================================================================================
  create-update-release:
    needs: [windows-cuda]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: List artifacts
        run: ls -R artifacts/
        
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        
      - name: Update Test CUDA Release
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request'
        with:
          tag_name: test-cuda
          name: test cuda
          body: |
            whisper.cpp Windows CUDA test builds.
            Last updated: ${{ steps.date.outputs.date }}
            
            This release is overwritten on every push to the test-cuda branch.
          files: |
            artifacts/**/*.node
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
